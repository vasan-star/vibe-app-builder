<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  

      <div 
          
            

          
        About QV37 AI
      </h3>

      <p class="text-sm text-zinc-400 mt-2">
        QV37 AI is being developed as a cloud-based AI application builder.
        Describe what you want to build and QV37 AI can generate a working application.
      </p>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mt-5">

        <div class="bg-zinc-950 border border-zinc-800 rounded-xl p-4">
          <div class="text-emerald-400 font-bold">
            01
          </div>
          <h4 class="font-semibold mt-2">
            Describe
          </h4>
          <p class="text-xs text-zinc-500 mt-1">
            Tell QV37 AI what you want.
          </p>
        </div>

        <div class="bg-zinc-950 border border-zinc-800 rounded-xl p-4">
          <div class="text-emerald-400 font-bold">
            02
          </div>
          <h4 class="font-semibold mt-2">
            Generate
          </h4>
          <p class="text-xs text-zinc-500 mt-1">
            AI generates the application.
          </p>
        </div>

        <div class="bg-zinc-950 border border-zinc-800 rounded-xl p-4">
          <div class="text-emerald-400 font-bold">
            03
          </div>
          <h4 class="font-semibold mt-2">
            Preview
          </h4>
          <p class="text-xs text-zinc-500 mt-1">
            Test your application instantly.
          </p>
        </div>

      </div>

    </section>

  </main>


  <!-- JAVASCRIPT -->
  <script>

    let credits = 12;

    const promptBox = document.getElementById("user-prompt");
    const generateBtn = document.getElementById("generate-btn");
    const buttonText = document.getElementById("button-text");
    const loader = document.getElementById("loader");
    const status = document.getElementById("status");

    const placeholder = document.getElementById("placeholder");
    const previewFrame = document.getElementById("preview-frame");

    const creditCount = document.getElementById("credit-count");


    function showStatus(message, type = "info") {

      status.classList.remove("hidden");

      status.className =
        "mt-4 p-3 rounded-xl border text-sm";

      if (type === "error") {

        status.classList.add(
          "bg-red-950",
          "border-red-800",
          "text-red-300"
        );

      } else {

        status.classList.add(
          "bg-zinc-950",
          "border-zinc-800",
          "text-zinc-400"
        );

      }

      status.textContent = message;
    }


    function setLoading(value) {

      generateBtn.disabled = value;

      if (value) {

        buttonText.textContent = "Building...";
        loader.classList.remove("hidden");

      } else {

        buttonText.textContent = "Build App";
        loader.classList.add("hidden");

      }

    }


    /*
      TEMPORARY LOCAL DEMO GENERATOR

      This makes the interface testable immediately.

      Later this function will be replaced with:

      /api/generate

      which will call the real cloud AI backend.
    */

    function createDemoApp(prompt) {

      const safePrompt =
        prompt.replace(/[<>]/g, "");

      return `
<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>QV37 AI Generated App</title>

<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  font-family:
  Arial,
  sans-serif;

  background:
  linear-gradient(
    135deg,
    #111827,
    #09090b
  );

  color: white;

}

.container {

  max-width: 900px;

  margin: auto;

  padding: 50px 20px;

}

.badge {

  display: inline-block;

  padding: 7px 12px;

  background: #10b981;

  color: #000;

  border-radius: 999px;

  font-size: 12px;

  font-weight: bold;

}

h1 {

  font-size:
  clamp(32px, 7vw, 64px);

  margin:
  20px 0 10px;

}

p {

  color: #a1a1aa;

  line-height: 1.7;

}

.card {

  margin-top: 30px;

  background: #18181b;

  border:
  1px solid #27272a;

  border-radius: 18px;

  padding: 25px;

}

button {

  background: #10b981;

  border: 0;

  padding: 12px 20px;

  border-radius: 10px;

  font-weight: bold;

  cursor: pointer;

}

button:hover {

  background: #34d399;

}

</style>

</head>

<body>

<div class="container">

<span class="badge">
QV37 AI GENERATED
</span>

<h1>
Your Application
</h1>

<p>
Generated from your request:
</p>

<div class="card">

<strong>
${safePrompt}
</strong>

<p>
This is a live preview generated by QV37 AI.
</p>

<button
onclick="alert('Application is working!')">
Test Application
</button>

</div>

</div>

</body>

</html>
`;
    }


    generateBtn.addEventListener(
      "click",
      async function () {

        const prompt =
          promptBox.value.trim();

        if (!prompt) {

          showStatus(
            "Please describe the application you want to build.",
            "error"
          );

          return;
        }


        if (credits <= 0) {

          showStatus(
            "Your free credits are exhausted.",
            "error"
          );

          return;
        }


        setLoading(true);

        showStatus(
          "Preparing your application..."
        );


        try {

          /*
            TEMPORARY TEST MODE

            This confirms that your frontend,
            button and preview work.

            We will replace this with the
            real cloud AI API next.
          */

          await new Promise(
            resolve =>
              setTimeout(resolve, 1200)
          );


          const generatedHTML =
            createDemoApp(prompt);


          previewFrame.srcdoc =
            generatedHTML;


          placeholder.classList.add(
            "hidden"
          );

          previewFrame.classList.remove(
            "hidden"
          );


          credits--;

          creditCount.textContent =
            credits;


          showStatus(
            "Application generated successfully."
          );


        } catch (error) {

          console.error(error);

          showStatus(
            "Something went wrong. Please try again.",
            "error"
          );

        } finally {

          setLoading(false);

        }

      }
    );


    document
      .querySelectorAll(".example-btn")
      .forEach(button => {

        button.addEventListener(
          "click",
          function () {

            promptBox.value =
              this.dataset.prompt;

            promptBox.focus();

          }
        );

      });

  </script>

</body>
</html>
